<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1200" height="460" fill="#ffffff"/>

  <!-- center hub -->
  <circle cx="600" cy="230" r="95" fill="#0b3d2e"/>
  <text x="600" y="220" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="bold">Your</text>
  <text x="600" y="245" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="bold">Use Case</text>

  <!-- spokes -->
  <g stroke="#cdb98a" stroke-width="3" fill="none">
    <line x1="600" y1="135" x2="600" y2="70"/>
    <line x1="685" y1="230" x2="960" y2="230"/>
    <line x1="600" y1="325" x2="600" y2="390"/>
    <line x1="515" y1="230" x2="240" y2="230"/>
  </g>

  <!-- Top: Prompt Engineering -->
  <g>
    <rect x="440" y="10" width="320" height="60" rx="12" fill="#1f6f54"/>
    <text x="600" y="35" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="bold">Prompt Engineering</text>
    <text x="600" y="56" text-anchor="middle" fill="#e8dcc3" font-size="12">Role · Task · Steps · Examples</text>
  </g>

  <!-- Right: Sheets -->
  <g>
    <rect x="960" y="165" width="200" height="130" rx="12" fill="#145c45"/>
    <text x="1060" y="205" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="bold">Sheets +</text>
    <text x="1060" y="228" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="bold">Gemini</text>
    <text x="1060" y="255" text-anchor="middle" fill="#e8dcc3" font-size="12">Format · chart · automate</text>
  </g>

  <!-- Bottom: Notebook -->
  <g>
    <rect x="440" y="390" width="320" height="60" rx="12" fill="#c96f34"/>
    <text x="600" y="415" text-anchor="middle" fill="#fff6ea" font-size="16" font-weight="bold">Gemini Notebook</text>
    <text x="600" y="436" text-anchor="middle" fill="#fff6ea" font-size="12">Grounded research and briefings</text>
  </g>

  <!-- Left: Gems -->
  <g>
    <rect x="40" y="165" width="200" height="130" rx="12" fill="#8a5a2b"/>
    <text x="140" y="215" text-anchor="middle" fill="#fff6ea" font-size="16" font-weight="bold">Gems</text>
    <text x="140" y="245" text-anchor="middle" fill="#ffe6cf" font-size="12">Save it once,</text>
    <text x="140" y="263" text-anchor="middle" fill="#ffe6cf" font-size="12">reuse every time</text>
  </g>
</svg>
