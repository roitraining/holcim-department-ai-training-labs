<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-label="A Gmail thread with a Gemini search beam lighting Gmail, Chat, and Drive piles, then four calendar slots">
  <defs>
    <linearGradient id="gmail-beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1e71d6"/>
      <stop offset="0.55" stop-color="#6a55e4"/>
      <stop offset="1" stop-color="#bd35c2"/>
    </linearGradient>
  </defs>

  <!-- Thread: stacked message bars -->
  <g transform="translate(24,48)">
    <rect x="0" y="0" width="220" height="22" rx="2" fill="#082445"/>
    <rect x="12" y="30" width="208" height="18" rx="2" fill="#495f7a"/>
    <rect x="0" y="56" width="220" height="22" rx="2" fill="#1e71d6"/>
    <rect x="12" y="86" width="196" height="18" rx="2" fill="#495f7a"/>
    <rect x="0" y="112" width="220" height="22" rx="2" fill="#082445"/>
    <text x="0" y="168" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="14">thread</text>
  </g>

  <!-- Side panel as a vertical gradient slit -->
  <rect x="268" y="40" width="18" height="200" fill="url(#gmail-beam)"/>

  <!-- Search beam -->
  <polygon points="286,140 430,72 430,208" fill="#6a55e4" opacity="0.28"/>

  <!-- Three hit piles -->
  <g transform="translate(448,48)" font-family="Inter, system-ui, sans-serif">
    <rect x="0" y="88" width="88" height="14" fill="#082445"/>
    <rect x="8" y="68" width="88" height="14" fill="#1e71d6"/>
    <rect x="16" y="48" width="88" height="14" fill="#082445"/>
    <rect x="24" y="20" width="88" height="22" fill="#bd35c2"/>
    <text x="44" y="148" text-anchor="middle" fill="#495f7a" font-size="14">Gmail</text>

    <g transform="translate(148,36)">
      <circle cx="22" cy="28" r="16" fill="#1e71d6"/>
      <circle cx="48" cy="18" r="12" fill="#6a55e4"/>
      <circle cx="40" cy="48" r="10" fill="#082445"/>
      <text x="36" y="112" text-anchor="middle" fill="#495f7a" font-size="14">Chat</text>
    </g>

    <g transform="translate(280,28)">
      <rect x="8" y="36" width="64" height="80" fill="#082445"/>
      <rect x="16" y="24" width="64" height="80" fill="#1e71d6"/>
      <rect x="24" y="8" width="64" height="80" fill="#6a55e4"/>
      <text x="56" y="132" text-anchor="middle" fill="#495f7a" font-size="14">Drive</text>
    </g>
  </g>

  <!-- Four proposed slots; one lit -->
  <g transform="translate(268,268)">
    <rect x="0" y="0" width="72" height="28" fill="none" stroke="#495f7a" stroke-width="2"/>
    <rect x="88" y="0" width="72" height="28" fill="#bd35c2"/>
    <rect x="176" y="0" width="72" height="28" fill="none" stroke="#495f7a" stroke-width="2"/>
    <rect x="264" y="0" width="72" height="28" fill="none" stroke="#495f7a" stroke-width="2"/>
    <text x="0" y="52" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="14">slots</text>
  </g>
</svg>
