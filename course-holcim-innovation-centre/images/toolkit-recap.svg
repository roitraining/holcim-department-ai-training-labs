<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 360" role="img" aria-label="One Gemini gradient ribbon threading a prompt stack, mail bars, slide pack, data grid, and notebook pages">
  <defs>
    <linearGradient id="gemini-ribbon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1e71d6"/>
      <stop offset="0.5" stop-color="#6a55e4"/>
      <stop offset="1" stop-color="#bd35c2"/>
    </linearGradient>
  </defs>

  <!-- Ribbon behind the five objects -->
  <path d="M40 180 C 140 80, 280 80, 380 180 S 620 280, 720 180 S 960 80, 1080 180" fill="none" stroke="url(#gemini-ribbon)" stroke-width="18" stroke-linecap="round"/>

  <!-- 1 Prompt stack -->
  <g transform="translate(48,96)">
    <rect x="8" y="40" width="112" height="16" fill="#082445"/>
    <rect x="8" y="60" width="112" height="20" fill="#1e71d6"/>
    <rect x="8" y="84" width="112" height="24" fill="#6a55e4"/>
    <rect x="8" y="112" width="112" height="28" fill="#bd35c2"/>
    <text x="64" y="176" text-anchor="middle" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="14">Prompt</text>
  </g>

  <!-- 2 Mail bars -->
  <g transform="translate(248,108)">
    <rect x="0" y="20" width="120" height="18" fill="#082445"/>
    <rect x="8" y="46" width="112" height="14" fill="#1e71d6"/>
    <rect x="0" y="68" width="120" height="18" fill="#082445"/>
    <rect x="8" y="94" width="100" height="14" fill="#6a55e4"/>
    <text x="60" y="164" text-anchor="middle" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="14">Gmail</text>
  </g>

  <!-- 3 Slide pack -->
  <g transform="translate(456,88)">
    <rect x="0" y="28" width="120" height="80" fill="#082445"/>
    <rect x="16" y="16" width="120" height="80" fill="#1e71d6"/>
    <rect x="32" y="4" width="120" height="80" fill="#6a55e4"/>
    <text x="92" y="184" text-anchor="middle" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="14">Slides</text>
  </g>

  <!-- 4 Grid -->
  <g transform="translate(680,100)">
    <rect x="0" y="16" width="28" height="22" fill="#082445"/>
    <rect x="32" y="16" width="28" height="22" fill="#1e71d6"/>
    <rect x="64" y="16" width="28" height="22" fill="#6a55e4"/>
    <rect x="96" y="16" width="28" height="22" fill="#bd35c2"/>
    <rect x="0" y="44" width="28" height="22" fill="#1e71d6"/>
    <rect x="32" y="44" width="28" height="22" fill="#082445"/>
    <rect x="64" y="44" width="28" height="22" fill="#bd35c2"/>
    <rect x="96" y="44" width="28" height="22" fill="#6a55e4"/>
    <rect x="0" y="72" width="28" height="22" fill="#082445"/>
    <rect x="32" y="72" width="28" height="22" fill="#6a55e4"/>
    <rect x="64" y="72" width="28" height="22" fill="#1e71d6"/>
    <rect x="96" y="72" width="28" height="22" fill="#082445"/>
    <text x="62" y="172" text-anchor="middle" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="14">Sheets</text>
  </g>

  <!-- 5 Notebook pages -->
  <g transform="translate(896,84)">
    <rect x="8" y="20" width="88" height="120" fill="#082445"/>
    <rect x="24" y="8" width="88" height="120" fill="#1e71d6"/>
    <rect x="36" y="28" width="56" height="6" fill="#ffffff"/>
    <rect x="36" y="42" width="48" height="4" fill="#ffffff"/>
    <rect x="36" y="54" width="52" height="4" fill="#ffffff"/>
    <text x="68" y="188" text-anchor="middle" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="14">Notebook</text>
  </g>
</svg>
