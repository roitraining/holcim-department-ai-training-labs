<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1200" height="460" fill="#ffffff"/>

  <!-- Gem outline, left side -->
  <g>
    <polygon points="230,50 340,150 300,400 160,400 120,150" fill="#0b3d2e"/>
    <polygon points="230,50 340,150 230,190 120,150" fill="#1f6f54"/>
    <polygon points="230,50 120,150 160,400 230,190" fill="#145c45"/>
    <text x="230" y="130" text-anchor="middle" fill="#e8dcc3" font-size="22" font-weight="bold">GEM</text>
    <text x="230" y="320" text-anchor="middle" fill="#e8dcc3" font-size="15" font-weight="bold">Holcim Job</text>
    <text x="230" y="342" text-anchor="middle" fill="#e8dcc3" font-size="15" font-weight="bold">Posting Writer</text>
  </g>

  <!-- 5 labeled layers on the right, connected to the gem -->
  <g stroke="#cdb98a" stroke-width="2" fill="none">
    <line x1="300" y1="90" x2="430" y2="70"/>
    <line x1="330" y1="160" x2="430" y2="150"/>
    <line x1="300" y1="240" x2="430" y2="230"/>
    <line x1="260" y1="320" x2="430" y2="310"/>
    <line x1="200" y1="380" x2="430" y2="390"/>
  </g>

  <g>
    <rect x="430" y="40" width="720" height="60" rx="10" fill="#f4efe2" stroke="#cdb98a"/>
    <text x="452" y="65" fill="#0b3d2e" font-size="16" font-weight="bold">Persona</text>
    <text x="452" y="86" fill="#4a4a3f" font-size="13">Holcim People communications partner — tone, audience, mission</text>
  </g>

  <g>
    <rect x="430" y="120" width="720" height="60" rx="10" fill="#f4efe2" stroke="#cdb98a"/>
    <text x="452" y="145" fill="#0b3d2e" font-size="16" font-weight="bold">Task</text>
    <text x="452" y="166" fill="#4a4a3f" font-size="13">What the Gem produces when asked — job posting, resume review</text>
  </g>

  <g>
    <rect x="430" y="200" width="720" height="60" rx="10" fill="#f4efe2" stroke="#cdb98a"/>
    <text x="452" y="225" fill="#0b3d2e" font-size="16" font-weight="bold">Constraints</text>
    <text x="452" y="246" fill="#4a4a3f" font-size="13">Do not invent salary, benefits, locations, or missing facts</text>
  </g>

  <g>
    <rect x="430" y="280" width="720" height="60" rx="10" fill="#f4efe2" stroke="#cdb98a"/>
    <text x="452" y="305" fill="#0b3d2e" font-size="16" font-weight="bold">Process</text>
    <text x="452" y="326" fill="#4a4a3f" font-size="13">The repeatable steps — outcomes, then quals, then draft</text>
  </g>

  <g>
    <rect x="430" y="360" width="720" height="60" rx="10" fill="#c96f34"/>
    <text x="452" y="385" fill="#fff6ea" font-size="16" font-weight="bold">Examples</text>
    <text x="452" y="406" fill="#fff6ea" font-size="13">Good vs weak bullets — locks in the quality bar every time</text>
  </g>

  <text x="815" y="450" text-anchor="middle" fill="#0b3d2e" font-size="15" font-style="italic">Saved once. Reused by the whole People team, every chat.</text>
</svg>
