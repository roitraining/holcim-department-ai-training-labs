<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" role="img" aria-label="A thin one-layer prompt leaking invented numbers next to a four-layer sealed stack labeled Role, Task, Steps, Examples">
  <defs>
    <linearGradient id="rtse-seal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1e71d6"/>
      <stop offset="0.5" stop-color="#6a55e4"/>
      <stop offset="1" stop-color="#bd35c2"/>
    </linearGradient>
  </defs>

  <!-- Thin incomplete prompt: one layer, leaks -->
  <g transform="translate(40,70)">
    <rect x="0" y="88" width="280" height="28" fill="#082445"/>
    <circle cx="70" cy="150" r="7" fill="#bd35c2"/>
    <circle cx="118" cy="176" r="6" fill="#bd35c2"/>
    <circle cx="166" cy="158" r="5" fill="#bd35c2"/>
    <circle cx="214" cy="188" r="7" fill="#bd35c2"/>
    <text x="140" y="80" text-anchor="middle" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="14">vague</text>
    <text x="70" y="220" text-anchor="middle" fill="#bd35c2" font-family="Inter, system-ui, sans-serif" font-size="12">51.4</text>
    <text x="166" y="232" text-anchor="middle" fill="#bd35c2" font-family="Inter, system-ui, sans-serif" font-size="12">MPa</text>
  </g>

  <!-- Sealed four-layer prompt -->
  <g transform="translate(420,36)">
    <rect x="0" y="0" width="500" height="44" fill="#082445"/>
    <text x="24" y="29" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="16">Role</text>
    <rect x="0" y="52" width="500" height="52" fill="#1e71d6"/>
    <text x="24" y="85" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="16">Task</text>
    <rect x="0" y="112" width="500" height="60" fill="#6a55e4"/>
    <text x="24" y="149" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="16">Steps</text>
    <rect x="0" y="180" width="500" height="72" fill="url(#rtse-seal)"/>
    <text x="24" y="222" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="16">Examples</text>
    <rect x="0" y="252" width="500" height="8" fill="#082445"/>
  </g>
</svg>
