<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" font-family="'Helvetica Neue', Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1200" height="480" fill="#ffffff"/>

  <!-- Gem outline, left side -->
  <g>
    <polygon points="230,60 340,160 300,410 160,410 120,160" fill="#041739"/>
    <polygon points="230,60 340,160 230,200 120,160" fill="#0C98CC"/>
    <polygon points="230,60 120,160 160,410 230,200" fill="#117DAF"/>
    <text x="230" y="140" text-anchor="middle" fill="#bfe3ff" font-size="24" font-weight="bold">GEM</text>
    <text x="230" y="330" text-anchor="middle" fill="#dff6ff" font-size="17" font-weight="bold">Holcim Job</text>
    <text x="230" y="352" text-anchor="middle" fill="#dff6ff" font-size="17" font-weight="bold">Posting Writer</text>
  </g>

  <!-- 5 labeled layers on the right, connected to the gem -->
  <g stroke="#9aa5b1" stroke-width="2" fill="none">
    <line x1="300" y1="95" x2="430" y2="75"/>
    <line x1="330" y1="165" x2="430" y2="155"/>
    <line x1="300" y1="245" x2="430" y2="235"/>
    <line x1="260" y1="325" x2="430" y2="315"/>
    <line x1="200" y1="390" x2="430" y2="400"/>
  </g>

  <g>
    <rect x="430" y="42" width="720" height="62" rx="10" fill="#eef3f6" stroke="#c7d0d9"/>
    <text x="452" y="68" fill="#041739" font-size="18" font-weight="bold">Persona</text>
    <text x="452" y="90" fill="#33465a" font-size="15">Holcim People Team communications partner: tone, audience, mission</text>
  </g>

  <g>
    <rect x="430" y="122" width="720" height="62" rx="10" fill="#eef3f6" stroke="#c7d0d9"/>
    <text x="452" y="148" fill="#041739" font-size="18" font-weight="bold">Task</text>
    <text x="452" y="170" fill="#33465a" font-size="15">What the Gem produces when asked: job posting, resume review</text>
  </g>

  <g>
    <rect x="430" y="202" width="720" height="62" rx="10" fill="#eef3f6" stroke="#c7d0d9"/>
    <text x="452" y="228" fill="#041739" font-size="18" font-weight="bold">Constraints</text>
    <text x="452" y="250" fill="#33465a" font-size="15">Do not invent salary, benefits, locations, or missing facts</text>
  </g>

  <g>
    <rect x="430" y="282" width="720" height="62" rx="10" fill="#eef3f6" stroke="#c7d0d9"/>
    <text x="452" y="308" fill="#041739" font-size="18" font-weight="bold">Process</text>
    <text x="452" y="330" fill="#33465a" font-size="15">The repeatable steps: outcomes, then quals, then draft</text>
  </g>

  <g>
    <rect x="430" y="362" width="720" height="62" rx="10" fill="#7BC04F"/>
    <text x="452" y="388" fill="#ffffff" font-size="18" font-weight="bold">Examples</text>
    <text x="452" y="410" fill="#f0ffe3" font-size="15">Good vs weak bullets: locks in the quality bar every time</text>
  </g>

  <text x="815" y="458" text-anchor="middle" fill="#041739" font-size="16" font-style="italic">Saved once. Reused by the whole People Team, every chat.</text>
</svg>
