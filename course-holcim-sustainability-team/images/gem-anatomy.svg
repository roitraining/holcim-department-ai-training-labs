<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" font-family="'Helvetica Neue', Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1200" height="500" fill="#ffffff"/>

  <!-- Gem: table (crown top), crown facet, left + right pavilion facets -->
  <g>
    <polygon points="200,60 260,60 360,170 100,170" fill="#04BBF1"/>
    <polygon points="100,170 230,170 230,460" fill="#041739"/>
    <polygon points="230,170 360,170 230,460" fill="#117DAF"/>
    <text x="230" y="140" text-anchor="middle" fill="#052033" font-size="22" font-weight="bold">GEM</text>
  </g>

  <!-- 6 labeled layers on the right, connected to the gem -->
  <g stroke="#9aa5b1" stroke-width="2" fill="none">
    <line x1="292" y1="73" x2="430" y2="69"/>
    <line x1="352" y1="140" x2="430" y2="139"/>
    <line x1="357" y1="207" x2="430" y2="209"/>
    <line x1="337" y1="274" x2="430" y2="279"/>
    <line x1="296" y1="341" x2="430" y2="349"/>
    <line x1="250" y1="408" x2="430" y2="419"/>
  </g>

  <g>
    <rect x="430" y="40" width="730" height="58" rx="10" fill="#eef3f6" stroke="#c7d0d9"/>
    <text x="452" y="64" fill="#041739" font-size="17" font-weight="bold">Persona</text>
    <text x="452" y="85" fill="#33465a" font-size="14">Holcim Sustainability communications partner, or SD reporting assistant</text>
  </g>

  <g>
    <rect x="430" y="110" width="730" height="58" rx="10" fill="#eef3f6" stroke="#c7d0d9"/>
    <text x="452" y="134" fill="#041739" font-size="17" font-weight="bold">Task</text>
    <text x="452" y="155" fill="#33465a" font-size="14">What the Gem produces: ECOPact content, or a cited year-end answer</text>
  </g>

  <g>
    <rect x="430" y="180" width="730" height="58" rx="10" fill="#0C98CC"/>
    <text x="452" y="204" fill="#ffffff" font-size="17" font-weight="bold">Knowledge (new)</text>
    <text x="452" y="225" fill="#eafbff" font-size="14">Attached files: HARP chapter, SD glossary, Annual Report excerpt</text>
  </g>

  <g>
    <rect x="430" y="250" width="730" height="58" rx="10" fill="#eef3f6" stroke="#c7d0d9"/>
    <text x="452" y="274" fill="#041739" font-size="17" font-weight="bold">Constraints</text>
    <text x="452" y="295" fill="#33465a" font-size="14">Do not invent a statistic, figure, or fact outside the approved sources</text>
  </g>

  <g>
    <rect x="430" y="320" width="730" height="58" rx="10" fill="#eef3f6" stroke="#c7d0d9"/>
    <text x="452" y="344" fill="#041739" font-size="17" font-weight="bold">Process</text>
    <text x="452" y="365" fill="#33465a" font-size="14">The repeatable steps: identify the ask, ground it, then draft</text>
  </g>

  <g>
    <rect x="430" y="390" width="730" height="58" rx="10" fill="#7BC04F"/>
    <text x="452" y="414" fill="#ffffff" font-size="17" font-weight="bold">Examples</text>
    <text x="452" y="435" fill="#f0ffe3" font-size="14">A fully cited sample answer locks in the quality bar every time</text>
  </g>
</svg>
