<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-label="Same six by four grid: left with a detached frozen chart, right with live scorecards sitting on the highlighted cells">
  <defs>
    <linearGradient id="canvas-live" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e71d6"/>
      <stop offset="1" stop-color="#bd35c2"/>
    </linearGradient>
  </defs>

  <!-- LEFT: grid plus a floating, unconnected chart -->
  <g transform="translate(48,88)">
    <rect x="0" y="40" width="240" height="160" fill="none" stroke="#495f7a" stroke-width="1.5"/>
    <g fill="#082445">
      <rect x="4" y="84" width="32" height="20"/>
      <rect x="44" y="76" width="32" height="28"/>
      <rect x="84" y="68" width="32" height="36"/>
      <rect x="124" y="92" width="32" height="12"/>
      <rect x="164" y="72" width="32" height="32"/>
      <rect x="204" y="80" width="32" height="24"/>
    </g>
    <!-- detached snapshot bars, not touching the grid -->
    <g transform="translate(40,-8)">
      <rect x="0" y="28" width="14" height="20" fill="#495f7a"/>
      <rect x="22" y="16" width="14" height="32" fill="#495f7a"/>
      <rect x="44" y="8" width="14" height="40" fill="#495f7a"/>
      <rect x="66" y="20" width="14" height="28" fill="#495f7a"/>
    </g>
    <text x="120" y="228" text-anchor="middle" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="14">chart</text>
  </g>

  <!-- RIGHT: same grid, live overlay cards locked to cells -->
  <g transform="translate(520,88)">
    <rect x="0" y="40" width="240" height="160" fill="none" stroke="#082445" stroke-width="2"/>
    <rect x="4" y="84" width="32" height="20" fill="#1e71d6"/>
    <rect x="44" y="76" width="32" height="28" fill="#6a55e4"/>
    <rect x="84" y="68" width="32" height="36" fill="url(#canvas-live)"/>
    <rect x="124" y="92" width="32" height="12" fill="#082445"/>
    <rect x="164" y="72" width="32" height="32" fill="#1e71d6"/>
    <rect x="204" y="80" width="32" height="24" fill="#6a55e4"/>
    <!-- scorecards sitting on the grid, same cells -->
    <rect x="252" y="48" width="88" height="44" rx="4" fill="#082445"/>
    <rect x="252" y="100" width="88" height="44" rx="4" fill="#1e71d6"/>
    <rect x="252" y="152" width="88" height="44" rx="4" fill="#bd35c2"/>
    <path d="M236 70 H252" stroke="#1e71d6" stroke-width="3"/>
    <path d="M236 122 H252" stroke="#6a55e4" stroke-width="3"/>
    <path d="M236 174 H252" stroke="#bd35c2" stroke-width="3"/>
    <text x="168" y="228" text-anchor="middle" fill="#495f7a" font-family="Inter, system-ui, sans-serif" font-size="14">canvas</text>
  </g>
</svg>
